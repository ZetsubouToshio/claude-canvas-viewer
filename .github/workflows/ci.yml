name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Install Chromium for the webview tests
        run: npx playwright-core install --with-deps chromium

      - name: Webview (browser) tests
        run: npm run test:e2e

      - name: Package VSIX
        run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: claude-canvas-viewer-vsix
          path: "*.vsix"
          if-no-files-found: error
