<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Dashboard</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: system-ui, sans-serif; background: #f4f5f9; color: #1c1c28; padding: 24px; }
  h1 { font-size: 24px; margin: 8px 0 20px; }
  .card { background: #fff; border-radius: 14px; padding: 18px; margin-bottom: 14px; box-shadow: 0 2px 8px #0001; }
  .card b { display: block; font-size: 28px; margin-top: 6px; }
  .row { display: flex; gap: 14px; }
  .row .card { flex: 1; }
  .tall { height: 900px; background: repeating-linear-gradient(#fff, #fff 40px, #eee 40px, #eee 41px); }
</style>
</head>
<body>
  <h1>Dashboard</h1>
  <div class="row">
    <div class="card">Visits<b>12,480</b></div>
    <div class="card">Orders<b>312</b></div>
  </div>
  <div class="card">Revenue<b>$48,210</b></div>
  <div class="card tall">Content taller than the artboard is clipped (no scrollbars).</div>
</body>
</html>
