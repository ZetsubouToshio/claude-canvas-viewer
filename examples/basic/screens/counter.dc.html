<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Counter</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, sans-serif; background: #101820; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
  #n { font-size: 64px; }
  button { padding: 12px 28px; border: 0; border-radius: 10px; background: #2ecc71; font-size: 18px; font-weight: 600; }
</style>
</head>
<body>
  <div id="n">0</div>
  <button id="inc">Increment</button>
  <script>
    var n = 0;
    document.getElementById('inc').addEventListener('click', function () {
      document.getElementById('n').textContent = ++n;
    });
    document.getElementById('n').dataset.scriptRan = 'yes';
  </script>
</body>
</html>
