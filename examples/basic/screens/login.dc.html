<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Login</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, sans-serif; background: linear-gradient(160deg, #6a5cff, #2a1f8f); color: #fff; display: flex; flex-direction: column; justify-content: center; padding: 32px; }
  h1 { font-size: 32px; margin: 0 0 8px; }
  p { opacity: .8; margin: 0 0 32px; }
  input { width: 100%; padding: 14px; margin-bottom: 14px; border: 0; border-radius: 10px; font-size: 16px; box-sizing: border-box; }
  button { width: 100%; padding: 14px; border: 0; border-radius: 10px; background: #ffd24a; font-size: 16px; font-weight: 600; }
</style>
</head>
<body>
  <h1>Welcome back</h1>
  <p>Sign in to continue</p>
  <input placeholder="Email">
  <input placeholder="Password" type="password">
  <button>Sign in</button>
</body>
</html>
